<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI导航 - 中国AI网站集合</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🚀 AI导航</h1>
            <p class="subtitle">发现最好的中国AI工具和平台</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索AI网站..." class="search-input">
                <button class="search-btn">🔍</button>
            </div>
        </header>

        <div class="categories" id="categories">
            <button class="category-btn active" data-category="all">全部</button>
        </div>

        <div class="websites-grid" id="websitesGrid">
            <!-- 网站卡片将在这里动态生成 -->
        </div>

        <footer class="footer">
            <p>© 2024 AI导航 | 汇集优质AI资源</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
